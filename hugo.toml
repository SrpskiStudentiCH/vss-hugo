baseURL = "https://srpskistudentich.github.io/vss-hugo/"
title = "Udruženje srpskih studenata"
languageCode = "sr-RS"
defaultContentLanguage = "sr"
defaultContentLanguageInSubdir = false
enableRobotsTXT = true
summaryLength = 28
buildDrafts = false
buildFuture = true
buildExpired = false

[params]
  description = "Premium statički sajt za Srpske studente u Švajcarskoj."
  brandLogo = "/images/brand/logo-vss-uss.png"
  ogImage = "/images/brand/logo-vss-uss.png"
  defaultImage = "/images/og-default.jpg"

  # URL Google Form-a za učlanjenje (otvara se u novom tabu).
  # Dok je prazno, CTA vodi na kontakt stranicu.
  joinFormUrl = "https://forms.gle/mUhni8ENvspYyWW68"

  # Google kalendar sa aktivnostima (prikaz na stranici Događaji).
  # ID je deo "src" parametra Google embed linka.
  eventsCalendarId = "NjYyYjM5NWUzMDBkNTVmMzNkZGYzNTJlNGVhYjUxZDVhY2ZiY2RmMGZmMjQ3YmY5YWE3YjY2MDRjZGRjOWRhZkBncm91cC5jYWxlbmRhci5nb29nbGUuY29t"
  eventsCalendarColor = "#7986cb"

  [params.contact]
    email = "info@srpskistudenti.ch"
    linkedin = "https://www.linkedin.com/"
    instagram = "https://www.instagram.com/verein_serbischer_studierender/"

  # Partneri i institucije koje podržavaju udruženje (prikaz na početnoj strani).
  [[params.partners]]
    name = "Srpski institut u Švajcarskoj"
    logo = "/images/partners/srpski-institut-u-svajcarskoj.png"
    url = "https://serbinstitut.ch/de/"
  [[params.partners]]
    name = "Srpska pravoslavna crkva"
    logo = "/images/partners/srpska-pravoslavna-crkva.jpg"
    url = "https://pravoslavnacrkva.ch/"
  [[params.partners]]
    name = "HELSE Kulturverein"
    logo = "/images/partners/helse.jpg"
    url = "https://helse.ch/about"
  [[params.partners]]
    name = "Srbi za Srbe"
    logo = "/images/partners/srbi-za-srbe.jpg"
    url = "https://www.srbizasrbe.org/svajcarska/"
  [[params.partners]]
    name = "OCES Lausanne"
    logo = "/images/partners/oces.jpg"
    url = "https://www.instagram.com/oceslausanne/"
  [[params.partners]]
    name = "VSETH"
    logo = "/images/partners/vseth.png"
    url = "https://vseth.ethz.ch/"
  [[params.partners]]
    name = "VSUZH"
    logo = "/images/partners/vsuzh.png"
    url = "https://www.vsuzh.ch/"
  [[params.partners]]
    name = "Generalni konzulat Republike Srbije u Cirihu"
    logo = "/images/partners/konzulat.png"
    url = "https://zurich.mfa.gov.rs/lat"
  [[params.partners]]
    name = "Ambasada Republike Srbije u Švajcarskoj"
    logo = "/images/partners/ambasada.png"
    url = "https://berne.mfa.gov.rs/de"

  # Podaci za donacije (prikaz na stranici Podrška).
  [params.donation]
    receiver = "Verein Serbischer Studierender"
    iban = "CH69 0070 0114 9050 6859 7"
    city = "8006 Zürich"
    qr = "/images/twint.png"

[pagination]
  pagerSize = 9

[permalinks]
  blog = "/blog/:year/:month/:slug/"
  events = "/events/:year/:month/:day/:slug/"
  guide = "/guide/:slug/"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3

[imaging]
  quality = 82
  resampleFilter = "Lanczos"

[taxonomies]
  category = "categories"
  tag = "tags"
  type = "types"

[languages]
  [languages.sr]
    languageName = "Srpski"
    weight = 1
    contentDir = "content"
  [languages.en]
    languageName = "English"
    weight = 2
    contentDir = "content/en"
  [languages.de]
    languageName = "Deutsch"
    weight = 3
    contentDir = "content/de"

[module]
  [[module.mounts]]
    source = "assets"
    target = "assets"
  [[module.mounts]]
    source = "static"
    target = "static"
  [[module.mounts]]
    source = "content"
    target = "content"
    lang = "sr"
    excludeFiles = ["en/**", "de/**"]
  [[module.mounts]]
    source = "content/en"
    target = "content"
    lang = "en"
  [[module.mounts]]
    source = "content/de"
    target = "content"
    lang = "de"
  [[module.mounts]]
    source = "layouts"
    target = "layouts"
  [[module.mounts]]
    source = "archetypes"
    target = "archetypes"