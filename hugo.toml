baseURL = "https://proton-org-rs.github.io/vss-hugo/"
title = "Srpski studenti u Švajcarskoj"
languageCode = "sr-RS"
defaultContentLanguage = "sr"
defaultContentLanguageInSubdir = false
enableRobotsTXT = true
summaryLength = 28
buildDrafts = false
buildFuture = true
buildExpired = false

[params]
  description = "Premium statički sajt za Srpske studente u Švajcarskoj."
  brandLogo = "/images/brand/logo-vss-uss.png"
  ogImage = "/images/brand/logo-vss-uss.png"
  defaultImage = "/images/og-default.jpg"

  # URL Google Form-a za učlanjenje (otvara se u novom tabu).
  # Dok je prazno, CTA vodi na kontakt stranicu.
  joinFormUrl = "https://forms.gle/mUhni8ENvspYyWW68"

  [params.contact]
    email = "info@srpskistudenti.ch"
    linkedin = "https://www.linkedin.com/"
    instagram = "https://www.instagram.com/verein_serbischer_studierender/"

[pagination]
  pagerSize = 9

[permalinks]
  blog = "/blog/:year/:month/:slug/"
  events = "/events/:year/:month/:day/:slug/"
  guide = "/guide/:slug/"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3

[imaging]
  quality = 82
  resampleFilter = "Lanczos"

[taxonomies]
  category = "categories"
  tag = "tags"
  type = "types"

[languages]
  [languages.sr]
    languageName = "Srpski"
    weight = 1
    contentDir = "content"
  [languages.en]
    languageName = "English"
    weight = 2
    contentDir = "content/en"
  [languages.de]
    languageName = "Deutsch"
    weight = 3
    contentDir = "content/de"

[module]
  [[module.mounts]]
    source = "assets"
    target = "assets"
  [[module.mounts]]
    source = "static"
    target = "static"
  [[module.mounts]]
    source = "content"
    target = "content"
    lang = "sr"
  [[module.mounts]]
    source = "content/en"
    target = "content"
    lang = "en"
  [[module.mounts]]
    source = "content/de"
    target = "content"
    lang = "de"
  [[module.mounts]]
    source = "layouts"
    target = "layouts"
  [[module.mounts]]
    source = "archetypes"
    target = "archetypes"