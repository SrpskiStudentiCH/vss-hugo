{{ define "main" }}
<article class="container content-page">
  <header class="page-hero">
    {{ partial "breadcrumbs.html" . }}
    <p class="eyebrow">{{ i18n "contact_title" }}</p>
    <h1>{{ .Title }}</h1>
    {{ with .Description }}<p class="lead">{{ . }}</p>{{ end }}
  </header>

  <div class="prose">
    {{ .Content }}
  </div>

  <div class="card-grid card-grid--three contact-info">
    <div class="card contact-card">
      <div class="contact-card__icon">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M22 6L12 13 2 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <h3>{{ i18n "contact_email" }}</h3>
      <p><a href="mailto:{{ site.Params.contact.email }}">{{ site.Params.contact.email }}</a></p>
    </div>

    <div class="card contact-card">
      <div class="contact-card__icon">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6zM2 9h4v12H2z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="4" cy="4" r="2" fill="currentColor"/></svg>
      </div>
      <h3>LinkedIn</h3>
      <p><a href="{{ site.Params.contact.linkedin }}" target="_blank" rel="noopener">LinkedIn</a></p>
    </div>

    <div class="card contact-card">
      <div class="contact-card__icon">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><rect x="2" y="2" width="20" height="20" rx="5" ry="5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="17.5" cy="6.5" r="1.5" fill="currentColor"/></svg>
      </div>
      <h3>Instagram</h3>
      <p><a href="{{ site.Params.contact.instagram }}" target="_blank" rel="noopener">Instagram</a></p>
    </div>
  </div>
</article>
{{ end }}
