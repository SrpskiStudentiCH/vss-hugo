{{ define "main" }}
<article class="container content-page">
  <header class="page-hero">
    {{ partial "breadcrumbs.html" . }}
    <p class="eyebrow">{{ i18n "contact_title" }}</p>
    <h1>{{ .Title }}</h1>
    {{ with .Description }}<p class="lead">{{ . }}</p>{{ end }}
  </header>
  <div class="prose">
    {{ .Content }}
  </div>
</article>
{{ end }}
