{{/* Render hook for markdown images: prepend baseURL path to root-relative srcs */}}
{{ $src := .Destination }}
{{ if hasPrefix $src "/" }}
  {{ $src = strings.TrimPrefix "/" $src | relURL }}
{{ end }}
<p><img src="{{ $src | safeURL }}" alt="{{ .Text }}" loading="lazy" {{ with .Title }}title="{{ . }}"{{ end }}></p>
