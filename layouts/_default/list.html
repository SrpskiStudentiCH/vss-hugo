{{ define "main" }}
<section class="container listing-page">
  <header class="page-hero">
    <p class="eyebrow">{{ .Section | humanize }}</p>
    <h1>{{ .Title }}</h1>
    {{ with .Description }}<p class="lead">{{ . }}</p>{{ end }}
    {{ with .Params.image }}
      <figure class="hero-image">
        <img src="{{ . }}" alt="{{ $.Title }}" loading="lazy">
      </figure>
    {{ end }}
  </header>

  <div class="card-grid">
    {{ range .Paginator.Pages }}
      <article class="card card--listing">
        <a href="{{ .RelPermalink }}">
          <p class="card__meta">{{ .Date.Format "2 Jan 2006" }}</p>
          <h2>{{ .Title }}</h2>
          <p>{{ .Summary }}</p>
        </a>
      </article>
    {{ end }}
  </div>

  {{ template "_internal/pagination.html" . }}
</section>
{{ end }}
