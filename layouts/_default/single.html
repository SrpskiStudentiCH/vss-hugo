{{ define "main" }}
<article class="content-page">
  <section class="page-hero container">
    {{ partial "breadcrumbs.html" . }}
    {{ with .Params.eyebrow }}<p class="eyebrow">{{ . }}</p>{{ end }}
    <h1>{{ .Title }}</h1>
    {{ with .Description }}<p class="lead">{{ . }}</p>{{ end }}
    {{ with .Params.image }}
      <figure class="hero-image">
        <img src="{{ . | strings.TrimPrefix "/" | relURL }}" alt="{{ $.Title }}" loading="lazy" width="1200" height="675">
      </figure>
    {{ end }}
  </section>

  <section class="container prose">
    {{ if .Params.toc }}
      <aside class="toc">{{ .TableOfContents }}</aside>
    {{ end }}
    {{ .Content }}
  </section>
</article>
{{ end }}
